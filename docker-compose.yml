services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamebot
      POSTGRES_USER: gamebot
      POSTGRES_PASSWORD: gamebot
    volumes:
      - gamebot_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  gamebot_pgdata:
